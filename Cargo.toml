[package]
name = "echo-daemon"
version = "0.3.0"
edition = "2021"

[dependencies]
# Async & Networking
tokio = { version = "1.36", features = ["rt-multi-thread", "net", "time", "macros", "signal", "io-util", "sync"] }
axum = { version = "0.7", default-features = false, features = ["json", "tokio", "http1"] }
tower-http = { version = "0.5", default-features = false, features = ["cors"] }
tower = { version = "0.4" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
async-trait = "0.1"
dotenvy = "0.15"
futures = "0.3"

# libp2p core + transports + protocols
libp2p = { version = "0.54", features = [
    "tokio", "noise", "yamux", "tcp", "ping", "identify",
    "kad", "macros", "secp256k1"
] }
libp2p-identity = { version = "0.2", features = ["secp256k1", "ed25519", "rand"] }

# Cryptography
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
snow = "0.9"
rand = "0.8"

# System
sysinfo = "0.30"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Persistence
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "postgres"], optional = true }

[features]
default = ["persistence"]
persistence = ["sqlx"]

[profile.dev]
opt-level = 1
debug = 1

[profile.release]
lto = "thin"
codegen-units = 1
