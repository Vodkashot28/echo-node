[package]
name = "echo-daemon"
version = "0.3.0"
edition = "2021"
# Docker base image (Dockerfile) carries Rust ≥1.88 — required by the lockfile.
rust-version = "1.88"

# Operator-facing binary name — canonical across clap (`--help`/`--version`),
# release artifacts, the installer, and the docs. The package name above stays
# `echo-daemon` for internal crate organization only.
[[bin]]
name = "echo-node"
path = "src/main.rs"

[dependencies]
# Async & Networking
tokio = { version = "1.36", features = ["rt-multi-thread", "net", "time", "macros", "signal", "io-util", "sync"] }
axum = { version = "0.7", default-features = false, features = ["json", "tokio", "http1"] }
tower-http = { version = "0.5", default-features = false, features = ["cors"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
async-trait = "0.1"
dotenvy = "0.15"
futures = "0.3"

# libp2p core + transports + protocols
libp2p = { version = "0.54", features = [
    "tokio", "noise", "yamux", "tcp", "quic", "identify",
    "kad", "macros", "relay", "dcutr", "autonat"
] }
libp2p-identity = { version = "0.2", features = ["ed25519", "rand"] }

# Cryptography
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
snow = "0.9"
rand = "0.8"

# System
sysinfo = "0.30"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# CLI
clap = { version = "4.5", features = ["derive"] }
directories = "5.0"
indicatif = "0.17"
toml = "0.8"

# Persistence (required — the daemon cannot run without a storage backend)
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "postgres"] }

# Canonical ledger hashing (sha256 event digests — already in the tree via
# ed25519-dalek, pinned here because ledger.rs calls it directly)
sha2 = "0.10"

# Unix-only: daemon detach (setsid) + stop signalling (kill) in the CLI
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.dev]
opt-level = 1
debug = 1

[profile.release]
lto = "thin"
codegen-units = 1

[dev-dependencies]
tempfile = "3"
