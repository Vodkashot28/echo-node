[package]
name = "echo-daemon"
version = "0.2.0"
edition = "2021"

[dependencies]
# Async & Networking
tokio = { version = "1.36", features = ["rt-multi-thread", "net", "time", "macros"] }
axum = { version = "0.7", default-features = false, features = ["json", "tokio", "http1"] }
tower-http = { version = "0.5", default-features = false, features = ["cors"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
dotenvy = "0.15"
reqwest = { version = "0.12", features = ["json"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# ML Core
linfa = { version = "0.7", features = ["serde"], optional = true }
linfa-trees = { version = "0.7", features = ["serde"], optional = true }
linfa-clustering = { version = "0.7", optional = true }
ndarray = { version = "0.15", features = ["serde"], optional = true }

# Vector DB & Data Engineering
lancedb = { version = "0.23", optional = true }
arrow-array = { version = "53.0", optional = true }
arrow-schema = { version = "53.0", optional = true }
futures = "0.3"

# System
sysinfo = "0.30"
chrono = { version = "0.4", features = ["serde"] }
sled = "0.34"
md5 = "0.7"

# Persistence
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite"], optional = true }

# SIMD (optional so features can control it)
lance-linalg = { version = "1.0.1", default-features = false, optional = true }

[features]
default = ["persistence"] # baseline daemon: networking + DB
ml = ["linfa", "linfa-trees", "linfa-clustering", "ndarray"]
lineage = ["lancedb", "arrow-array", "arrow-schema"]
persistence = ["sqlx"]

# Mobile builds (Termux/proot): no fp16kernels
mobile = []

# Desktop builds (x86_64 or aarch64 with fp16 support)
desktop = ["lance-linalg"]

# Edge builds (optimized nodes, include lance-linalg)
edge = ["lance-linalg"]

[profile.dev]
opt-level = 1
debug = 1

[profile.release]
lto = "thin"
codegen-units = 1
