name: Docker image (GHCR)

# Builds the Dockerfile and publishes it to GHCR so Render can pull a
# prebuilt image instead of compiling the Rust dependency graph on every
# deploy (render.yaml `image.url` must stay in sync with the tags below).
#
# Uses the workflow-scoped GITHUB_TOKEN — no PAT/secret setup required.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pinned by SHA)

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3 (pinned by SHA)

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3 (pinned by SHA)
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR paths must be lowercase; owner/repo may contain uppercase.
      - id: image
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6 (pinned by SHA)
        with:
          context: .
          push: true
          # :latest is what render.yaml pulls; :sha-* keeps a rollback trail.
          tags: |
            ghcr.io/${{ steps.image.outputs.name }}:latest
            ghcr.io/${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
