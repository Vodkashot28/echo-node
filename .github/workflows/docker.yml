name: Docker image (GHCR)

# Builds the Dockerfile and publishes it to GHCR so Render can pull a
# prebuilt image instead of compiling the Rust dependency graph on every
# deploy (render.yaml `image.url` must stay in sync with the tags below).
#
# Uses the workflow-scoped GITHUB_TOKEN — no PAT/secret setup required.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR paths must be lowercase; owner/repo may contain uppercase.
      - id: image
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # :latest is what render.yaml pulls; :sha-* keeps a rollback trail.
          tags: |
            ghcr.io/${{ steps.image.outputs.name }}:latest
            ghcr.io/${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
