name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: cargo check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pinned by SHA)

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (pinned by SHA)
        with:
          components: clippy

      - name: Cache cargo registry + build artifacts
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2 (pinned by SHA)
        with:
          shared-key: ci

      - name: Type-check (all targets)
        run: cargo check --all-targets

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pinned by SHA)

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (pinned by SHA)
        with:
          components: clippy

      - name: Cache cargo registry + build artifacts
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2 (pinned by SHA)
        with:
          shared-key: ci

      - name: Lint (all targets, deny warnings)
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-latest
    # Tunnel e2e tests (session ticket resumption, Noise_XX relay) can take
    # several minutes on cold CI runners — bumped from 30 to 45.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pinned by SHA)

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (pinned by SHA)

      - name: Cache cargo registry + build artifacts
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2 (pinned by SHA)
        with:
          shared-key: ci

      # Create the ticket store dir so the session-ticket e2e test can persist
      # tickets during CI (tunnel_e2e::session_ticket_issued_stored_and_resumed).
      - name: Create data directories
        run: mkdir -p data/tickets

      - name: Run test suite (235 tests)
        run: cargo test -- --nocapture

  deny:
    name: cargo deny (advisories + licenses + bans)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pinned by SHA)

      # Supply-chain gate over the resolved dependency graph (deny.toml):
      # real CVEs fail; workspace-unmaintained crates fail; unmaintained
      # transitive crates and duplicate versions warn.
      - uses: EmbarkStudios/cargo-deny-action@b66acf5e9fe20f8aba065be86778a8a4c846f902 # v2 (pinned by SHA)

  build:
    name: cargo build (release)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [check, clippy, test, deny]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pinned by SHA)

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (pinned by SHA)

      - name: Cache cargo registry + build artifacts
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2 (pinned by SHA)
        with:
          shared-key: ci
          cache-targets: true

      - name: Build (release, thin LTO)
        run: cargo build --release

      - name: Upload binary artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (pinned by SHA)
        with:
          name: echo-node-linux-amd64
          path: target/release/echo-node
          retention-days: 14
