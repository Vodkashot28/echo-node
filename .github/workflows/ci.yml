name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: cargo check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci

      - name: Type-check (all targets)
        run: cargo check --all-targets

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci

      - name: Lint (all targets, deny warnings)
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-latest
    # Tunnel e2e tests (session ticket resumption, Noise_XX relay) can take
    # several minutes on cold CI runners — bumped from 30 to 45.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci

      # Create the ticket store dir so the session-ticket e2e test can persist
      # tickets during CI (tunnel_e2e::session_ticket_issued_stored_and_resumed).
      - name: Create data directories
        run: mkdir -p data/tickets

      - name: Run test suite (235 tests)
        run: cargo test -- --nocapture

  build:
    name: cargo build (release)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [check, clippy, test]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          cache-targets: true

      - name: Build (release, thin LTO)
        run: cargo build --release

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: echo-node-linux-amd64
          path: target/release/echo-node
          retention-days: 14
