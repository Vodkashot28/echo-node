services:
  - type: web
    name: echo-node
    # Prebuilt image published by .github/workflows/docker.yml → GHCR.
    # Render pulls it instead of building (deploy ≈ pull + start, no Rust
    # compile). Keep this path in sync with that workflow's tags.
    # NOTE: `runtime: image` is required by Render's blueprint validator —
    # `docker` runtime cannot be combined with an image field.
    runtime: image
    image:
      url: ghcr.io/vodkashot28/echo-node:latest
    # Image updates are NOT automatic on push: the GHCR job must finish
    # pushing :latest first, so deploy manually (dashboard → Deploy) or via
    # the Render API once the workflow is green.
    autoDeploy: false
    # Render health-checks the HTTP port automatically once the service is up.
    healthCheckPath: /health
    # Render free tier — upgrade to standard for persistent disk + more RAM
    plan: free
    envVars:
      # Render injects PORT; we forward it into LISTEN_ADDR so the daemon
      # binds on the right port. TUNNEL_ADDR is kept internal (not routed
      # publicly by Render — use a TCP service or private network for that).
      - key: LISTEN_ADDR
        value: 0.0.0.0:10000   # Render free tier always routes to port 10000
      - key: TUNNEL_ADDR
        value: 0.0.0.0:3002
      - key: IDENTITY_PATH
        value: /home/echomesh/data/identity.json
      - key: SQLITE_DB
        value: sqlite:/home/echomesh/data/echo_node.db
      - key: RUST_LOG
        value: echo_daemon=info
      - key: NODE_MODE
        value: provider
      - key: DHT_LOCAL_ONLY
        value: "false"
      - key: NODE_REGION
        value: auto
      # Secrets — values live in the Render dashboard, never in this file.
      # `sync: false` reserves the key: the first `render blueprint launch`
      # prompts for the value; afterwards the dashboard copy is authoritative
      # and this file never stores it.
      - key: DATABASE_URL
        sync: false
      - key: API_KEY
        sync: false
      - key: USER_ID
        value: default
      - key: NODE_NAME
        value: EchoNode
